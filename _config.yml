# ------------------------------------------------------------
#  GadgetGyaan — site settings
#  Edit the values marked  <-- CHANGE  and push to GitHub.
# ------------------------------------------------------------

title: GadgetGyaan
tagline: Honest tech advice for India and the world
description: >-
  Simple, honest guides to phones, laptops, earbuds and everyday tech —
  for buyers in India and around the world who want the best value for their money.
author: Kitek Sood
lang: en

url: "https://thegadgetgyaan.com"
baseurl: ""                                      # leave empty if the repo is named YOUR-USERNAME.github.io

contact_email: "kiteksood167@gmail.com"

google_analytics: "G-PEV8WFHB1J"   # Google Analytics 4 Measurement ID
pinterest_verify: "83598c6cf56d763fee229c1783e6fde7"              # <-- Pinterest "claim website" code (the content="..." value)
cusdis_app_id: ""                 # <-- Cusdis App ID; comments appear on posts once this is filled in

# Money settings — leave empty until you are approved.
adsense_client: ""          # <-- e.g. "ca-pub-1234567890123456" after AdSense approval
amazon_tag: "gadgetgyaan00-21"              # <-- Amazon.in Associates tag, e.g. "gadgetgyaan-21"
flipkart_affid: "kiteksood"          # <-- Flipkart Affiliate ID (affid); adds a Flipkart button to India buy boxes
amazon_tag_us: ""           # <-- Amazon.com Associates tag for Global posts, e.g. "gadgetgyaan-20"

# Categories shown in the menu
# All categories (order = order on homepage chips and mobile menu)
categories_menu:
  - Launches
  - Phones
  - Laptops
  - Audio
  - Wearables
  - Tablets
  - Gaming
  - Accessories
  - Smart Home
  - Guides
  - Global

# Shown directly in the desktop header; the rest go under "More"
nav_primary:
  - Launches
  - Phones
  - Laptops
  - Audio
  - Global

timezone: Asia/Kolkata
permalink: /:title/
markdown: kramdown
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _drafts_queue
  - WRITING_GUIDE.md
  - assets/images/README.md

logo: /assets/icon-512.png
