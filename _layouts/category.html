---
layout: default
---
{% assign posts = site.posts | where: "category", page.category %}
<section class="cat-header cat-{{ page.category | slugify }}">
  <div class="wrap">
    <p class="eyebrow">Category</p>
    <h1>{{ page.category }}</h1>
    <p class="lede">{{ page.blurb }}</p>
  </div>
</section>
<section class="wrap section">
  {% if posts.size > 0 %}
  <div class="card-grid">
    {% for p in posts %}{% include card.html post=p %}{% endfor %}
  </div>
  {% else %}
  <p class="muted">New posts are on the way. Check back soon.</p>
  {% endif %}
</section>
