{% assign p = include.post %}{% assign c = p.category | default: 'Guides' %}
<a class="card" href="{{ p.url | relative_url }}">
  <div class="card-cover cat-{{ c | slugify }}{% if p.image %} has-img{% endif %}" aria-hidden="true">
    {% if p.image %}<img src="{% include thumb.html src=p.image %}" width="720" height="405" alt="{{ p.image_alt | default: p.title | escape }}" loading="lazy" decoding="async">{% else %}{% include cat-icon.html cat=c %}{% endif %}
  </div>
  <div class="card-body">
    <span class="chip chip-sm">{{ c }}</span>
    <h3>{{ p.title }}</h3>
    <p>{{ p.description | default: p.excerpt | strip_html | truncate: 120 }}</p>
    <span class="card-meta">{{ p.date | date: "%-d %b %Y" }}</span>
  </div>
</a>
