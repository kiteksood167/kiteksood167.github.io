<aside class="author-box">
  <img src="{{ site.data.author.photo | relative_url }}" alt="{{ site.data.author.name }}" width="72" height="72" loading="lazy">
  <div>
    <p class="author-label">Edited &amp; published by</p>
    <p class="author-name"><a href="{{ '/about/' | relative_url }}">{{ site.data.author.name }}</a></p>
    <p class="author-role">{{ site.data.author.role }}</p>
    <p class="author-bio">{{ site.data.author.bio }}</p>
  </div>
</aside>
