<script>
(function () {
  document.querySelectorAll('.share').forEach(function (box) {
    var url = box.getAttribute('data-url'), title = box.getAttribute('data-title');
    var copy = box.querySelector('.share-copy'), native = box.querySelector('.share-native');
    if (copy) copy.addEventListener('click', function () {
      var label = copy.querySelector('.share-copy-text');
      function done() { label.textContent = 'Copied!'; setTimeout(function () { label.textContent = 'Copy link'; }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function () { window.prompt('Copy this link:', url); }); }
      else { window.prompt('Copy this link:', url); }
    });
    if (native && navigator.share) {
      native.hidden = false;
      native.addEventListener('click', function () { navigator.share({ title: title, url: url }).catch(function () {}); });
    }
  });
})();
</script>
